node {
  name = "emqx@ecosmart-emqx"
  data_dir = "/opt/emqx/data"
}
listeners.tcp.default.bind = "0.0.0.0:1883"
listeners.ws.default.enable = false
listeners.ssl.default.enable = false
listeners.wss.default.enable = false
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "/opt/emqx/etc/bootstrap.csv"
    bootstrap_type = plain
  }
]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [{ type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }]
}

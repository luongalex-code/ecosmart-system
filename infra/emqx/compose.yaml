name: ecosmart-task2
services:
  emqx:
    # Reuse the locally inspected 6.3.0 image; immutable digest avoids a moving latest tag.
    image: emqx/emqx:6.3.0@sha256:3b6d9c0c419930074b7e0e6cba07baceea584b2094d22f16ff02f6c075c3d5b8
    hostname: ecosmart-emqx
    ports:
      - "127.0.0.1:${MQTT_PORT:-18883}:1883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18093}:18083"
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Run node init-local.js first}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Run node init-local.js first}
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./bootstrap.csv:/opt/emqx/etc/bootstrap.csv:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  emqx_data:
  emqx_log:
